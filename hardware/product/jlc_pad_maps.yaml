# Parts whose EasyEDA footprint numbers pads differently from KiCad / manufacturer datasheet.
C20526:
  # MMBT3904 SOT-23: EasyEDA 1=B, 2=E, 3=C matches KiCad Transistors_SMD SOT-23.
  map: { "1": ["1"], "2": ["2"], "3": ["3"] }

C22371519:
  # Worldsemi WS2812B-MINI-V3J datasheet p.2 is JEDEC CCW top-view (1=VDD top-left,
  # 2=DOUT bottom-left, 3=VSS bottom-right chamfer, 4=DIN top-right). EasyEDA's expand
  # footprint mirrors 1<->2 and 3<->4; map land pattern pads and align to F.SilkS Pin-1/chamfer.
  map: { "1": ["2"], "2": ["1"], "3": ["4"], "4": ["3"] }
