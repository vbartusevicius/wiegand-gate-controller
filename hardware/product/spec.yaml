# Single source of truth for Wiegand Gate Controller PCBs and the compact JLC3DP enclosure
# sized for the ROGER BH30 battery compartment.
# Units: millimetres. Board coordinate system (main PCB, top view, +y = gate/relay edge, -y = power/reader edge):
#   x = 0.0 .. 74.0 mm
#   y = 0.0 .. 54.0 mm
#   z = 0.0 at main PCB bottom face; tall/THT parts on F.Cu (+z), low-profile SMDs split across F.Cu & B.Cu

product:
  name: Wiegand Gate Controller
  revision: A
  release: v1
  status: draft-unvalidated

active_variant: v1

envelope:
  outer_width: 80.0
  outer_depth: 60.0
  outer_height: 29.5
  wall: 2.0
  min_clearance_to_pcb: 0.4
  fasteners: "4 x M3x12 stainless socket head screws + 4 x M3 hex nuts"

enclosure:
  material: PA12-or-ASA
  wall: 2.0
  min_clearance_to_pcb: 0.4
  parts: [base, lid]

variants:
  v1:
    description: "Compact ESP32-C6 Wiegand + ROGER BH30/610/HS Gate & Door Controller (9-32V in, 12V reader, 2x Form-C relays, 3x opto inputs, 2x RGB LED, Restart button)"
    boards: [main]

boards:
  main:
    plane: horizontal-xy
    thickness: 1.6
    max_outline: { width: 74.0, height: 54.0 }
    domains:
      SELV-MAIN: all

